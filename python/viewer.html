<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>re-droid viewer</title>
<script src="https://cdn.jsdelivr.net/npm/jmuxer@2.1.0/dist/jmuxer.min.js"></script>
<style>
  :root { --bg: #181a1b; --fg: #e8e6e3; --accent: #4fc3f7; --bar: #23272a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
  #toolbar { width: 100%; background: var(--bar); padding: 6px 16px; display: flex;
             align-items: center; gap: 12px; font-size: 13px; flex-shrink: 0; }
  #toolbar .title { font-weight: 600; color: var(--accent); }
  #toolbar .status { opacity: 0.6; }
  #toolbar button { background: none; border: 1px solid rgba(255,255,255,0.2); color: var(--fg);
                     padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  #toolbar button:hover { border-color: var(--accent); color: var(--accent); }
  #viewer { flex: 1; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; width: 100%; }
  #phone { position: relative; height: 100%; max-height: 100%; aspect-ratio: 9/16; }
  #player { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  #touch-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                  cursor: default; touch-action: none; z-index: 2;
                  user-select: none; -webkit-user-select: none; outline: none; }
  .connecting { display: flex; align-items: center; justify-content: center;
                position: absolute; inset: 0; color: var(--fg); font-size: 16px; opacity: 0.7; z-index: 3; }
</style>
</head>
<body>
<div id="toolbar">
  <span class="title" id="instance-name">re-droid</span>
  <span class="status" id="status-text">Conectando...</span>
  <span style="flex:1"></span>
  <button onclick="sendKey(3)" title="Home">Home</button>
  <button onclick="sendKey(4)" title="Back">Back</button>
  <button onclick="sendKey(187)" title="Recents">Recents</button>
</div>
<div id="viewer">
  <div id="phone">
    <video id="player" muted autoplay playsinline></video>
    <div id="touch-layer" tabindex="-1"></div>
  </div>
  <div class="connecting" id="connecting-overlay">Conectando ao dispositivo...</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const instanceName = params.get('name') || 'unknown';
const apiBase = location.origin;
const wsBase = `ws://${location.host}`;

document.getElementById('instance-name').textContent = `re-droid: ${instanceName}`;
document.title = `re-droid: ${instanceName}`;

const ANDROID_W = 720;
const ANDROID_H = 1280;

let jmuxerInstance = null;
let screenWs = null;
let inputWs = null;

function connectScreen() {
  if (screenWs && screenWs.readyState <= 1) return;

  const statusEl = document.getElementById('status-text');
  const overlay = document.getElementById('connecting-overlay');
  statusEl.textContent = 'Conectando...';
  overlay.style.display = 'flex';

  jmuxerInstance = new JMuxer({
    node: 'player',
    mode: 'video',
    flushingTime: 50,
    fps: 30,
    clearBuffer: true,
    debug: false,
    onReady: () => {
      statusEl.textContent = 'Conectado';
      overlay.style.display = 'none';
    },
    onError: (e) => {
      console.error('jmuxer error', e);
    }
  });

  screenWs = new WebSocket(`${wsBase}/ws/screen/${encodeURIComponent(instanceName)}`);
  screenWs.binaryType = 'arraybuffer';

  screenWs.onmessage = (ev) => {
    if (ev.data instanceof ArrayBuffer) {
      jmuxerInstance.feed({ video: new Uint8Array(ev.data) });
    }
  };

  screenWs.onopen = () => {
    statusEl.textContent = 'Streaming...';
  };

  screenWs.onclose = () => {
    statusEl.textContent = 'Desconectado';
    overlay.style.display = 'flex';
    overlay.textContent = 'Conexão perdida. Reconectando...';
    if (jmuxerInstance) { try { jmuxerInstance.destroy(); } catch(e){} }
    setTimeout(connectScreen, 2000);
  };

  screenWs.onerror = () => {
    screenWs.close();
  };
}

function connectInput() {
  if (inputWs && inputWs.readyState <= 1) return;

  inputWs = new WebSocket(`${wsBase}/ws/input/${encodeURIComponent(instanceName)}`);

  inputWs.onclose = () => {
    setTimeout(connectInput, 2000);
  };
  inputWs.onerror = () => { inputWs.close(); };
}

function wsSend(obj) {
  if (!inputWs || inputWs.readyState !== 1) return;
  inputWs.send(JSON.stringify(obj));
}

function sendKey(keycode) { wsSend({ type: 'key', keycode }); }

// --- Touch/mouse event handling ---
const touchLayer = document.getElementById('touch-layer');
let mouseDown = false;
let lastMoveTime = 0;
let lastDownTime = 0;
const MOVE_THROTTLE_MS = 16;
const DOWN_DEBOUNCE_MS = 50;

function getCoords(e) {
  const rect = touchLayer.getBoundingClientRect();
  const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  const y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
  return [x, y];
}

touchLayer.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  touchLayer.focus();
  touchLayer.setPointerCapture(e.pointerId);
  const now = performance.now();
  if (now - lastDownTime < DOWN_DEBOUNCE_MS) return;
  lastDownTime = now;
  mouseDown = true;
  const [x, y] = getCoords(e);
  wsSend({ type: 'down', x, y });
});

touchLayer.addEventListener('pointermove', (e) => {
  if (!mouseDown) return;
  e.preventDefault();
  const now = performance.now();
  if (now - lastMoveTime < MOVE_THROTTLE_MS) return;
  lastMoveTime = now;
  const [x, y] = getCoords(e);
  wsSend({ type: 'move', x, y });
});

touchLayer.addEventListener('pointerup', (e) => {
  if (!mouseDown) return;
  e.preventDefault();
  mouseDown = false;
  wsSend({ type: 'up' });
});

touchLayer.addEventListener('pointerleave', () => {
  if (mouseDown) {
    mouseDown = false;
    wsSend({ type: 'up' });
  }
});

touchLayer.addEventListener('contextmenu', (e) => e.preventDefault());
touchLayer.addEventListener('dragstart', (e) => e.preventDefault());

touchLayer.addEventListener('wheel', (e) => {
  e.preventDefault();
  const [x, y] = getCoords(e);
  const dir = e.deltaY > 0 ? 'down' : 'up';
  wsSend({ type: 'scroll', x, y, dir });
}, { passive: false });

// --- Keyboard handling ---
const KEY_MAP = {
  'Backspace': 67, 'Enter': 66, 'Escape': 111, 'Delete': 112,
  'ArrowUp': 19, 'ArrowDown': 20, 'ArrowLeft': 21, 'ArrowRight': 22,
  'Tab': 61,
};

touchLayer.addEventListener('keydown', (e) => {
  if (KEY_MAP[e.key]) {
    e.preventDefault();
    sendKey(KEY_MAP[e.key]);
  } else if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
    e.preventDefault();
    wsSend({ type: 'text', text: e.key });
  }
});

touchLayer.focus();
connectScreen();
connectInput();
</script>
</body>
</html>
