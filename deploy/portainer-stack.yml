services:
  db:
    image: postgres:16-alpine
    container_name: redroid-ui-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-redroid_saas}
      POSTGRES_USER: ${POSTGRES_USER:-redroid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-redroid} -d ${POSTGRES_DB:-redroid_saas}"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: redroid-ui-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - internal

  api:
    image: ${DOCKERHUB_NAMESPACE}/redroid-ui-api:${API_TAG:-latest}
    container_name: redroid-ui-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-redroid}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-redroid_saas}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TOOLS_DIR: /opt/redroid-ui/tools
      REDROID_SCRIPT_DIR: /opt/redroid-ui/redroid-script
      DATA_ROOT: /data/instances
      DATA_VOLUME: redroid-ui-instance-data
      REDROID_USE_SUDO_DOCKER: "0"
      REDROID_DOCKER_NETWORK: ${REDROID_DOCKER_NETWORK:-redroid-runtime}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - instance_data:/data/instances
    networks:
      - internal
      - redroid

  worker:
    image: ${DOCKERHUB_NAMESPACE}/redroid-ui-api:${API_TAG:-latest}
    container_name: redroid-ui-worker
    restart: unless-stopped
    command: celery -A config worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-redroid}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-redroid_saas}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TOOLS_DIR: /opt/redroid-ui/tools
      REDROID_SCRIPT_DIR: /opt/redroid-ui/redroid-script
      DATA_ROOT: /data/instances
      DATA_VOLUME: redroid-ui-instance-data
      REDROID_USE_SUDO_DOCKER: "0"
      REDROID_DOCKER_NETWORK: ${REDROID_DOCKER_NETWORK:-redroid-runtime}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - instance_data:/data/instances
    networks:
      - internal
      - redroid

  frontend:
    image: ${DOCKERHUB_NAMESPACE}/redroid-ui-frontend:${FRONTEND_TAG:-latest}
    container_name: redroid-ui-frontend
    restart: unless-stopped
    networks:
      - internal

  gateway:
    image: nginx:1.27-alpine
    container_name: redroid-ui-gateway
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    command:
      - /bin/sh
      - -ec
      - |
        cat >/etc/nginx/conf.d/default.conf <<'EOF'
        upstream api {
          server api:8000;
        }
        upstream frontend {
          server frontend:80;
        }
        server {
          listen 80;
          server_name _;
          client_max_body_size 500M;

          location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
          }

          location /admin/ {
            proxy_pass http://api;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location /ws/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
          }

          location / {
            proxy_pass http://frontend;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
          }
        }
        EOF
        nginx -g 'daemon off;'
    networks:
      - internal

networks:
  internal:
    name: redroid-ui-internal
  redroid:
    external: true
    name: ${REDROID_DOCKER_NETWORK:-redroid-runtime}

volumes:
  pgdata:
    name: redroid-ui-pgdata
  instance_data:
    name: redroid-ui-instance-data
