version: '3.8'

services:
  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: redroid_saas
      POSTGRES_USER: redroid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redroid_dev_pass}
      REDROID_FORCE_ADB_INPUT: "1"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redroid -d redroid_saas"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      internal:
        aliases:
          - virtuale-db

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      internal:
        aliases:
          - virtuale-redis

  api:
    image: maissistemasdev/redroid-cloud-be:3.0
    container_name: virtuale-be
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - instance_data:/data/instances
      # Mount tools directory for virtual keyboard/touch binaries
      - /home/daniel/Documentos/Projetos/redroid-ui/web/tools:/opt/redroid-ui/tools:ro
    environment:
      DATABASE_URL: postgres://redroid:${POSTGRES_PASSWORD:-redroid_dev_pass}@virtuale-db:5432/redroid_saas
      REDIS_URL: redis://virtuale-redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TOOLS_DIR: /opt/redroid-ui/tools
      REDROID_SCRIPT_DIR: /opt/redroid-ui/redroid-script
      DATA_ROOT: /data/instances
      DATA_VOLUME: ${STACK_NAME:-virtuale}_instance_data
      REDROID_USE_SUDO_DOCKER: "0"
      REDROID_DOCKER_NETWORK: redroid-ui
      REDROID_FORCE_ADB_INPUT: "1"
      REDROID_STREAM_SIZE: "480x854"
      REDROID_STREAM_BITRATE: "1800000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - redroid
      - proxy-network

  worker:
    image: maissistemasdev/redroid-cloud-be:3.0
    container_name: virtuale-worker
    command: celery -A config worker -l info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - instance_data:/data/instances
      # Mount tools directory for virtual keyboard/touch binaries
      - /home/daniel/Documentos/Projetos/redroid-ui/web/tools:/opt/redroid-ui/tools:ro
    environment:
      RUN_MIGRATIONS: "0"
      DATABASE_URL: postgres://redroid:${POSTGRES_PASSWORD:-redroid_dev_pass}@virtuale-db:5432/redroid_saas
      REDIS_URL: redis://virtuale-redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TOOLS_DIR: /opt/redroid-ui/tools
      REDROID_SCRIPT_DIR: /opt/redroid-ui/redroid-script
      DATA_ROOT: /data/instances
      DATA_VOLUME: ${STACK_NAME:-virtuale}_instance_data
      REDROID_USE_SUDO_DOCKER: "0"
      REDROID_DOCKER_NETWORK: redroid-ui
      REDROID_FORCE_ADB_INPUT: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - redroid

  frontend:
    container_name: virtuale-fe
    image: maissistemasdev/redroid-cloud-fe:2.0
    depends_on:
      - api
    networks:
      - internal
      - redroid
      - proxy-network
    ports:
      - 8085:80

networks:
  internal:
  redroid:
    external: true
    name: redroid-ui
  proxy-network:
    external: true

volumes:
  pgdata:
  instance_data:
