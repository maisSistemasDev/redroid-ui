version: '3.8'

services:
  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: redroid_saas
      POSTGRES_USER: redroid
      POSTGRES_PASSWORD: redroid_dev_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redroid -d redroid_saas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: virtuale-be
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - instance_data:/data/instances
    environment:
      DATABASE_URL: postgres://redroid:redroid_dev_pass@db:5432/redroid_saas
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-me
      DEBUG: "1"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8080"
      TOOLS_DIR: /opt/virtuale/tools
      BUILD_SCRIPT_DIR: /opt/virtuale/redroid-script
      DATA_ROOT: /data/instances
      DATA_VOLUME: virtuale_instance_data
      USE_SUDO_DOCKER: "0"
      DOCKER_NETWORK: web_default
      FORCE_ADB_INPUT: "1"
      STREAM_SIZE: "480x854"
      STREAM_BITRATE: "1800000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: virtuale-worker
    command: celery -A config worker -l info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - instance_data:/data/instances
    environment:
      RUN_MIGRATIONS: "0"
      DATABASE_URL: postgres://redroid:redroid_dev_pass@db:5432/redroid_saas
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-me
      DEBUG: "1"
      ALLOWED_HOSTS: "*"
      TOOLS_DIR: /opt/virtuale/tools
      BUILD_SCRIPT_DIR: /opt/virtuale/redroid-script
      DATA_ROOT: /data/instances
      DATA_VOLUME: virtuale_instance_data
      USE_SUDO_DOCKER: "0"
      DOCKER_NETWORK: web_default
      FORCE_ADB_INPUT: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: virtuale-fe
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  instance_data:
